<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#5b86e5,#8e44ad);
      transition:0.5s;
      padding:20px;
    }

    .weather-card{
      width:420px;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
      text-align:center;
    }

    h1{
      margin-bottom:10px;
      color:#222;
    }

    .date-time{
      margin-bottom:20px;
      color:#666;
      font-size:14px;
    }

    .search-box{
      display:flex;
      gap:10px;
      margin-bottom:20px;
      flex-wrap:wrap;
      justify-content:center;
    }

    .search-box input{
      flex:1;
      min-width:180px;
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
      outline:none;
      font-size:15px;
    }

    .search-box button{
      padding:12px 15px;
      border:none;
      border-radius:10px;
      background:#3498db;
      color:white;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .search-box button:hover{
      background:#2980b9;
    }

    .weather-info{
      display:none;
      margin-top:20px;
    }

    .city{
      font-size:28px;
      font-weight:bold;
      color:#222;
    }

    .temp{
      font-size:55px;
      font-weight:bold;
      margin:15px 0;
      color:#111;
    }

    .condition{
      font-size:22px;
      color:#555;
      text-transform:capitalize;
      margin-bottom:20px;
    }

    .details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
    }

    .box{
      padding:15px;
      border-radius:15px;
      color:white;
      font-weight:bold;
    }

    .box h3{
      margin-bottom:8px;
      font-size:15px;
    }

    .box p{
      font-size:18px;
    }

    .box:nth-child(1){
      background:#3b82f6;
    }

    .box:nth-child(2){
      background:#10b981;
    }

    .box:nth-child(3){
      background:#f59e0b;
    }

    .box:nth-child(4){
      background:#8b5cf6;
    }

    .loading{
      margin-top:10px;
      color:#444;
      font-weight:bold;
    }

    @media(max-width:500px){

      .weather-card{
        width:100%;
      }

      .search-box{
        flex-direction:column;
      }

    }

  </style>
</head>

<body>

  <div class="weather-card">

    <h1>Weather Dashboard</h1>

    <div class="date-time" id="dateTime"></div>

    <div class="search-box">

      <input 
        type="text" 
        id="cityInput" 
        placeholder="Enter city name"
      >

      <button onclick="getWeather()">
        Search
      </button>

      <button onclick="getLocationWeather()">
        Use Location
      </button>

    </div>

    <div class="loading" id="loading"></div>

    <div class="weather-info" id="weatherInfo">

      <div class="city" id="cityName"></div>

      <div class="temp" id="temperature"></div>

      <div class="condition" id="condition"></div>

      <div class="details">

        <div class="box">
          <h3>Feels Like</h3>
          <p id="feelsLike"></p>
        </div>

        <div class="box">
          <h3>Humidity</h3>
          <p id="humidity"></p>
        </div>

        <div class="box">
          <h3>Pressure</h3>
          <p id="pressure"></p>
        </div>

        <div class="box">
          <h3>Wind Speed</h3>
          <p id="wind"></p>
        </div>

      </div>

    </div>

  </div>

  <script>

    // YOUR API KEY
    const apiKey = "8ab7009e7d7288985cce48c0895d7018";

    // DATE & TIME
    function updateDateTime(){

      const now = new Date();

      document.getElementById("dateTime").innerHTML =
      now.toLocaleDateString() + " | " +
      now.toLocaleTimeString();

    }

    setInterval(updateDateTime,1000);

    updateDateTime();

    // SEARCH WEATHER
    async function getWeather(){

      const city = document.getElementById("cityInput").value.trim();

      if(city === ""){

        alert("Please enter city name");
        return;

      }

      const url =
      `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`;

      fetchWeather(url);

    }

    // FETCH WEATHER
    async function fetchWeather(url){

      const loading = document.getElementById("loading");

      loading.innerHTML = "Loading weather data...";

      try{

        const response = await fetch(url);

        const data = await response.json();

        console.log(data);

        if(data.cod != 200){

          loading.innerHTML = "";
          alert(data.message);
          return;

        }

        displayWeather(data);

        loading.innerHTML = "";

      }

      catch(error){

        loading.innerHTML = "";

        alert("Something went wrong");

        console.log(error);

      }

    }

    // DISPLAY WEATHER
    function displayWeather(data){

      document.getElementById("weatherInfo").style.display = "block";

      document.getElementById("cityName").innerHTML =
      `${data.name}, ${data.sys.country}`;

      document.getElementById("temperature").innerHTML =
      `${Math.round(data.main.temp)}°C`;

      document.getElementById("condition").innerHTML =
      data.weather[0].description;

      document.getElementById("feelsLike").innerHTML =
      `${Math.round(data.main.feels_like)}°C`;

      document.getElementById("humidity").innerHTML =
      `${data.main.humidity}%`;

      document.getElementById("pressure").innerHTML =
      `${data.main.pressure} hPa`;

      document.getElementById("wind").innerHTML =
      `${data.wind.speed} m/s`;

      changeBackground(data.main.temp);

    }

    // LOCATION WEATHER
    function getLocationWeather(){

      if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

          async(position)=>{

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            const url =
            `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${apiKey}`;

            fetchWeather(url);

          },

          ()=>{

            alert("Location access denied");

          }

        );

      }

      else{

        alert("Geolocation not supported");

      }

    }

    // DYNAMIC BACKGROUND
    function changeBackground(temp){

      if(temp <= 15){

        document.body.style.background =
        "linear-gradient(135deg,#74ebd5,#ACB6E5)";

      }

      else if(temp > 15 && temp <= 30){

        document.body.style.background =
        "linear-gradient(135deg,#f6d365,#fda085)";

      }

      else{

        document.body.style.background =
        "linear-gradient(135deg,#ff512f,#dd2476)";

      }

    }

  </script>

</body>
</html>
